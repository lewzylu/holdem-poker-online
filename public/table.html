<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>牌桌 · 德州扑克</title>
<link rel="stylesheet" href="/css/table.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<header class="topbar">
  <div class="brand">♠ 德州扑克</div>
  <div class="tinfo">
    <span id="room-tag">房间 —</span>
    <span class="sep">·</span>
    <span id="blind-tag2">盲注 —</span>
    <span class="sep">·</span>
    <span id="hand-tag">第 0 手</span>
  </div>
  <div class="me">
    <span id="me-name2">—</span>
    <span class="chip-badge" id="me-chips2">0</span>
    <span class="chip-badge table-chips" id="me-table">桌上 0</span>
  </div>
  <div class="topbtns">
    <button id="btn-panel" class="ghost panel-toggle">记录</button>
    <button id="btn-rebuy" class="ghost">补给</button>
    <button id="btn-stand" class="ghost">站起</button>
    <button id="btn-lobby" class="ghost">返回大厅</button>
  </div>
</header>

<div class="layout">
  <main class="table-main">
    <!-- .table-fit 是可用区域，.table-canvas 是固定 1200×600 的逻辑画布。
         画布内一切尺寸都是常量，整体由 JS 写入的 --tscale 等比缩放后居中，多余空间留白。 -->
    <div class="table-wrap">
      <div class="table-fit" id="table-fit">
        <div class="table-canvas" id="table-canvas">
          <!-- .felt 是桌面本体（画布内居中的圆角长方形），只放桌面上的东西 -->
          <div class="felt">
            <div class="table-top">
              <div class="phase-tag" id="phase">准备</div>
              <div class="pot" id="pot"><span class="label">底池</span><b>0</b></div>
              <div class="blind-tag" id="blind">—</div>
            </div>
            <div class="board" id="board"></div>
            <div class="waiting" id="waiting" hidden>牌局未开始，等待房主开局…</div>
          </div>
          <!-- 座位在 .felt 之外、直接挂在画布上：槽位坐标就是画布坐标，
               与桌面的位置和边框宽度完全解耦，侧边席位也才能骑在桌沿外侧。 -->
          <div class="seats" id="seats"></div>
        </div>
      </div>
      <!-- 竖屏引导：显隐只由 CSS 的 @media (orientation: portrait) 控制，JS 不参与，
           所以牌局照常进行、倒计时照常走、超时照常触发 -->
      <div class="rotate-hint">
        <div class="rh-icon">⟳</div>
        <div class="rh-text">请旋转到横屏</div>
        <div class="rh-sub">牌桌是固定 2:1 的横向画面，竖屏放不下。牌局仍在继续，下方操作按钮照常可用。</div>
      </div>
    </div>

    <div class="action-bar" id="action-bar">
      <div class="prompt" id="prompt">等待发牌…</div>
      <div class="buttons">
        <button id="btn-fold" class="act fold" disabled><span class="lbl">弃牌</span> <kbd>F</kbd></button>
        <button id="btn-call" class="act call" disabled><span class="lbl">跟注</span> <kbd>C</kbd></button>
        <div class="raise-box">
          <input type="range" id="raise-slider" min="0" max="100" value="0" disabled>
          <div class="quick" id="quick">
            <button data-frac="0.5" disabled>1/2 池</button>
            <button data-frac="0.66" disabled>2/3 池</button>
            <button data-frac="1" disabled>1 池</button>
          </div>
        </div>
        <button id="btn-raise" class="act raise" disabled><span class="lbl">加注</span> <kbd>R</kbd></button>
        <button id="btn-allin" class="act allin" disabled>全下 <kbd>A</kbd></button>
        <div class="timer" id="timer" hidden>
          <span class="timer-sec" id="timer-sec">30</span>
          <span class="timer-track"><span id="timer-bar"></span></span>
        </div>
      </div>
    </div>
  </main>

  <aside class="side">
    <div class="panel">
      <h3>座位</h3>
      <table class="score" id="score"><tbody></tbody></table>
    </div>
    <div class="panel grow">
      <h3>牌局记录</h3>
      <div class="log" id="log"></div>
    </div>
    <div class="panel">
      <h3>聊天</h3>
      <div id="chat" class="chat small"></div>
      <div class="chat-input">
        <input id="chat-text" type="text" maxlength="120" placeholder="说点什么…">
        <button id="chat-send" class="ghost">发送</button>
      </div>
    </div>
  </aside>
</div>

<div class="result-float" id="result" hidden></div>
<div id="toast" class="toast"></div>

<script src="/js/cards.js"></script>
<script src="/js/net.js"></script>
<script src="/js/common.js"></script>
<script src="/js/table.js"></script>
</body>
</html>
